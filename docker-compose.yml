# Production стек. Два режима reverse-proxy (Этап 9.0):
#  1) Хостовый nginx (рекомендуется, если на сервере уже есть nginx — добавляется
#     site из deploy/nginx/site.conf.example, TLS — certbot --nginx): web
#     публикуется только на loopback 127.0.0.1:8001, сервисы nginx/certbot
#     из compose не поднимаются (профили по умолчанию выключены).
#  2) Bundled-proxy: `docker compose --profile bundled-proxy up -d` — свой
#     nginx на :80/:443 + certbot (docker/nginx.conf), для сторонних чистых
#     инсталляций (ТЗ 1.2).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-хранилище файлов (замена MinIO: публичные образы MinIO удалены из реестров,
  # репозиторий архивирован 25.04.2026). API и filer — только внутри docker-сети
  # приложений: наружу не публикуются (браузер ходит в приложение через authorized-
  # proxy /media/<ключ>; TLS наружу обеспечивает nginx).
  # s3-prod.json (в корне репозитория на сервере, вне git): identities app/admin —
  # приложение использует app-пользователя с минимальными правами на bucket mynotes
  # (Read/List/Write, без Admin); docker/s3-prod.json.example — шаблон.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.port=8333 -ip=s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3_data:/data
      - ./s3-prod.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Создание бакета PUT'ом filer-директории /buckets/<name> (идемпотентно; || true
  # — если бакет уже существует). Секретов не требует: filer внутри внутренней сети.
  s3-init:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["curl -fsS -X PUT http://s3:8888/buckets/${S3_BUCKET:-mynotes}/ -o /dev/null || true"]
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
  web:
    image: ${MYNOTES_WEB_IMAGE:-mynotes-web}:${IMAGE_TAG:-latest}
    command: sh -c "python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 3"
    # Статика — bind ./staticfiles: collectstatic пишет туда, хостовый nginx
    # раздаёт alias'ом (паттерн сервера), WhiteNoise остаётся фолбэком.
    ports:
      - "127.0.0.1:8001:8001"  # loopback: только для хостового nginx, наружу не публикуется
    volumes:
      - ./staticfiles:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      # Внутренний S3 endpoint (перекрывает env_file); ключи — из .env (app-identity
      # с минимальными правами из s3-prod.json, не admin/root).
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-mynotes}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${MYNOTES_WEB_IMAGE:-mynotes-web}:${IMAGE_TAG:-latest}
    command: celery -A config worker --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-mynotes}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: ${MYNOTES_WEB_IMAGE:-mynotes-web}:${IMAGE_TAG:-latest}
    command: celery -A config beat --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot_vehicle:
    image: ${MYNOTES_BOT_IMAGE:-mynotes-bot}:${IMAGE_TAG:-latest}
    command: python -m telegram_bots.vehicle_bot.main
    environment:
      - TELEGRAM_VEHICLE_BOT_TOKEN=${TELEGRAM_VEHICLE_BOT_TOKEN}
      - TELEGRAM_HTTP_PROXY=${TELEGRAM_HTTP_PROXY:-}
      - BOT_STATE_DB=/data/vehicle.db
    volumes:
      - bot_state:/data
    depends_on:
      - web
    restart: unless-stopped

  bot_planner:
    image: ${MYNOTES_BOT_IMAGE:-mynotes-bot}:${IMAGE_TAG:-latest}
    command: python -m telegram_bots.planner_bot.main
    environment:
      - TELEGRAM_PLANNER_BOT_TOKEN=${TELEGRAM_PLANNER_BOT_TOKEN}
      - TELEGRAM_HTTP_PROXY=${TELEGRAM_HTTP_PROXY:-}
      - BOT_STATE_DB=/data/planner.db
    volumes:
      - bot_state:/data
    depends_on:
      - web
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # Только в режиме bundled-proxy (см. шапку файла); в режиме хостового nginx
    # не поднимается — иначе порты 80/443 конфликтуют с серверным nginx.
    profiles: ["bundled-proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      # media_volume убран: /media/ больше не раздаётся nginx — приватные файлы
      # отдаёт приложение через authorized-proxy (План MinIO/S3).
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles: ["bundled-proxy"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres_data:
  media_volume:
  bot_state:
  s3_data:
