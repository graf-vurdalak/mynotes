<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Мои записи</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-md">
    <!-- Логотип -->
    <div class="flex justify-center mb-8">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-600 to-emerald-500 flex items-center justify-center shadow-lg">
        <svg class="w-11 h-11 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10m10 0h4m-4 0H9m10 0v-6a1 1 0 00-1-1h-2"/>
        </svg>
      </div>
    </div>
    
    <!-- Карточка формы -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h1 class="text-2xl font-bold text-center text-slate-900 mb-2">Вход в систему</h1>
      <p class="text-center text-slate-500 mb-8">Мои записи · Бортжурнал и планировщик</p>
      
      <form class="space-y-5">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </div>
            <input type="email" placeholder="you@example.com" 
                   class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
          </div>
        </div>
        
        <!-- Пароль -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Пароль</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input type="password" placeholder="••••••••" 
                   class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
          </div>
        </div>
        
        <!-- Запомнить меня + Забыли пароль -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-slate-600">Запомнить меня</span>
          </label>
          <a href="#" class="text-blue-600 hover:text-blue-700 font-medium">Забыли пароль?</a>
        </div>
        
        <!-- Кнопка Войти -->
        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200">
          Войти
        </button>
      </form>
      
      <!-- Разделитель -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-3 bg-white text-slate-500">или</span>
        </div>
      </div>
      
      <!-- Яндекс OAuth -->
      <button class="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-semibold py-3 rounded-lg flex items-center justify-center gap-3 shadow-md hover:shadow-lg transition duration-200">
        <svg class="w-6 h-6" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2V7zm0 8h2v2h-2v-2z"/>
        </svg>
        Войти через Яндекс
      </button>
      
      <!-- Регистрация -->
      <p class="text-center text-sm text-slate-600 mt-6">
        Нет аккаунта? 
        <a href="#" class="text-blue-600 hover:text-blue-700 font-semibold">Зарегистрироваться</a>
      </p>
    </div>
    
    <!-- Подвал -->
    <p class="text-center text-xs text-slate-400 mt-6">
      © 2026 Мои записи. Все права защищены.
    </p>
  </div>

</body>
</html>
