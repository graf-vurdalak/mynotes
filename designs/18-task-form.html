<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новая задача — Рабочее</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">

<div class="flex h-screen overflow-hidden">
  <aside class="hidden lg:flex lg:flex-col w-64 bg-white border-r border-slate-200">
    <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-100">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-emerald-500"></div>
      <div><div class="font-bold text-slate-900">Мои записи</div><div class="text-xs text-slate-500">v1.0</div></div>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50">Дашборд</a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50">Бортжурнал</a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-emerald-50 text-emerald-700 font-medium">Записная книжка</a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50">Отчёты</a>
    </nav>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center px-4 lg:px-8">
      <div class="flex items-center gap-3">
        <a href="#" class="p-2 rounded-lg hover:bg-slate-100">
          <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div>
          <div class="text-xs text-slate-500">Записная книжка · <a href="#" class="text-emerald-600 hover:underline">Рабочее</a> · Kanban</div>
          <div class="text-sm font-semibold text-slate-900">Новая задача</div>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 lg:p-8">
      <form class="max-w-3xl mx-auto space-y-6">
        <!-- Заголовок + описание (Markdown) -->
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <label class="block text-sm font-semibold text-slate-700 mb-2">Заголовок <span class="text-red-500">*</span></label>
          <input type="text" placeholder="Что нужно сделать?" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
          <label class="block text-sm font-semibold text-slate-700 mt-4 mb-2">Описание <span class="text-xs font-normal text-slate-400">Markdown поддерживается</span></label>
          <div class="flex gap-1 mb-1">
            <button type="button" class="px-2 py-1 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded">B</button>
            <button type="button" class="px-2 py-1 text-xs italic text-slate-600 hover:bg-slate-100 rounded">I</button>
            <button type="button" class="px-2 py-1 text-xs text-slate-600 hover:bg-slate-100 rounded font-mono">&lt;/&gt;</button>
            <button type="button" class="px-2 py-1 text-xs text-slate-600 hover:bg-slate-100 rounded">•列表</button>
          </div>
          <textarea rows="4" placeholder="## Контекст&#10;– Что уже сделано&#10;– Критерии готовности" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm font-mono focus:ring-2 focus:ring-emerald-500 focus:border-transparent"></textarea>
        </div>

        <!-- Статус / проект / приоритет -->
        <div class="bg-white rounded-xl border border-slate-200 p-5 grid md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Статус</label>
            <select class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500">
              <option selected>🔘 Новый</option>
              <option>🔵 Оценка</option>
              <option>🟡 В работе</option>
              <option>🟠 Тестирование</option>
              <option>🟢 Готово</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Проект</label>
            <select class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500">
              <option>— без проекта —</option>
              <option selected>Работа (бэкенд)</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Приоритет</label>
            <select class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500">
              <option>Низкий</option>
              <option selected>Обычный</option>
              <option>Высокий</option>
              <option>🔥 Срочный</option>
            </select>
          </div>
        </div>

        <!-- Даты и время -->
        <div class="bg-white rounded-xl border border-slate-200 p-5 grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Дата начала</label>
            <input type="date" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Дедлайн</label>
            <div class="flex gap-2">
              <input type="date" class="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
              <input type="time" class="w-28 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Оценка времени, часов</label>
            <input type="number" step="0.5" placeholder="напр. 8" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Фактическое время, часов</label>
            <input type="number" step="0.5" placeholder="заполняется по ходу" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <!-- Теги + повторение -->
        <div class="bg-white rounded-xl border border-slate-200 p-5 grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Теги</label>
            <div class="flex flex-wrap items-center gap-2 p-2 border border-slate-200 rounded-lg">
              <span class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 text-xs font-medium px-2 py-1 rounded">backend <button class="text-blue-300 hover:text-blue-500">×</button></span>
              <input type="text" class="flex-1 min-w-[6rem] px-2 py-1 text-sm border-0 focus:ring-0" placeholder="тег + Enter">
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Повторение</label>
            <select class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500">
              <option selected>Не повторяется</option>
              <option>Ежедневно</option>
              <option>Еженедельно</option>
              <option>Ежемесячно</option>
              <option>Ежегодно</option>
              <option>По дням недели…</option>
              <option>Произвольный интервал…</option>
            </select>
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 pb-8">
          <a href="#" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">Отмена</a>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow-md hover:shadow-lg transition">Создать задачу</button>
        </div>
      </form>
    </main>
  </div>
</div>

</body>
</html>
