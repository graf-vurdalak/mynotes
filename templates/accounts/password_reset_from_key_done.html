{% extends "base.html" %}
{% load i18n_lang %}

{% block title %}Пароль изменён — {% app_name %}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full">
    <div class="flex justify-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-teal-500 rounded-2xl flex items-center justify-center shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
      <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mb-2">Пароль успешно изменён</h1>
      <p class="text-slate-500">Теперь можно войти в аккаунт с новым паролем.</p>
      <a href="{% url 'login' %}" class="block w-full mt-6 text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200">
        Перейти ко входу
      </a>
    </div>

    <p class="text-center text-xs text-slate-500 mt-8">
      &copy; 2026 {% app_name %}. {% t 'app.tagline' %}
    </p>
  </div>
</div>
{% endblock %}
