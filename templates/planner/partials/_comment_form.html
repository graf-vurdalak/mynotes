{% load i18n_lang %}
<form method="post" action="{% url 'planner:comment_add' task.pk %}" enctype="multipart/form-data" class="mt-4">
  {% csrf_token %}
  <div class="flex gap-2">
    {{ form.text }}
    <button type="submit" class="self-end bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-4 py-2.5 transition" title="{% t 'pl.comment_send' %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
    </button>
  </div>
  {% for e in form.text.errors %}<p class="field-errors">{{ e }}</p>{% endfor %}
  <div class="mt-2">
    <label class="text-xs text-slate-500">{% t 'pl.attach_file' %}</label>
    {{ form.files }}
    {% for e in form.files.errors %}<p class="field-errors">{{ e }}</p>{% endfor %}
  </div>
</form>
