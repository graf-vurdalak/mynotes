{% load i18n_lang %}
<style>
  .form-input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.875rem; background: #fff; }
  .form-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.4); border-color: transparent; }
  .form-select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.875rem; background: #fff; }
  .form-select:focus { outline: none; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.4); }
  .flex > .form-input { flex: 1 1 0%; min-width: 0; }
  .field-label { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 0.5rem; }
  .field-errors { font-size: 0.75rem; color: #ef4444; margin-top: 0.25rem; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background-color: #e2e8f0; }
  .calendar-day { background-color: #fff; min-height: 110px; padding: 6px; cursor: pointer; transition: background-color .15s; }
  .calendar-day:hover { background-color: #f8fafc; }
  .calendar-day.other-month { background-color: #f8fafc; }
  .calendar-day.today { background-color: #ecfdf5; }
  .calendar-day.selected { box-shadow: inset 0 0 0 2px #10b981; }
  .event-pill { font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .kanban-scroll { overflow-x: auto; }
  .kanban-scroll::-webkit-scrollbar { height: 8px; }
  .kanban-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .kanban-card { cursor: grab; }
  .kanban-card:active { cursor: grabbing; }
  .kanban-drop-ghost { opacity: .35; }
</style>
