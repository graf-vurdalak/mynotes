{% load i18n_lang %}
<!-- Шапка страниц Записной книжки (по макетам 06/07/16–21) -->
<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 flex-shrink-0">
  <div class="flex items-center gap-3">
    <button class="lg:hidden p-2 rounded-lg hover:bg-slate-100">
      <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <a href="{% url 'planner:home' %}" class="p-2 rounded-lg hover:bg-slate-100 transition" title="{% t 'pl.back' %}">
      <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
    </a>
    <div class="hidden sm:block">
      <div class="text-xs text-slate-500">{% t 'nav.planner' %}{% if header_crumb %} · {{ header_crumb }}{% endif %}</div>
      <div class="text-sm font-semibold text-slate-900">{{ header_title }}</div>
    </div>
  </div>
  <div class="flex items-center gap-2">
    {{ header_actions|safe }}
    <a href="{% url 'planner:search' %}" class="p-2 rounded-lg hover:bg-slate-100 transition" title="{% t 'pl.search' %}">
      <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </a>
  </div>
</header>
